<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KertasBiru &mdash; Platform Baca Novel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --pastel-bg: #f3f8fe;
      --pastel-card: #ffffff;
      --pastel-soft: #e3effd;
      --pastel-border: #c5daf5;
      --pastel-text: #162b4d;
      --pastel-muted: #526d96;
      --pastel-accent: #2563eb;
      --pastel-accent-hover: #1d4ed8;
    }

    html.dark {
      --pastel-bg: #0b1324;
      --pastel-card: #121e36;
      --pastel-soft: #1a2b4c;
      --pastel-border: #243b66;
      --pastel-text: #eef4ff;
      --pastel-muted: #93aed6;
      --pastel-accent: #3b82f6;
      --pastel-accent-hover: #2563eb;
    }

    body {
      background-color: var(--pastel-bg);
      color: var(--pastel-text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .reader-prose {
      font-family: "Lora", Georgia, serif;
    }

    @keyframes slideFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-slide-enter {
      animation: slideFadeIn 0.45s ease-out;
    }

    .slideshow-transparent-body {
      background: rgba(255, 255, 255, 0.56);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    html.dark .slideshow-transparent-body {
      background: rgba(18, 30, 54, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .chapter-scroll-box {
      max-height: 280px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .ad-slot-card {
      background-color: var(--pastel-card);
      border: 1px dashed var(--pastel-border);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header Atas -->
  <header class="bg-[var(--pastel-card)] border-b border-[var(--pastel-border)] sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <a
        href="#home"
        onclick="goHomePage(event)"
        class="flex items-center gap-2.5 font-extrabold text-lg tracking-tight text-[var(--pastel-text)]"
      >
        <span class="w-8 h-8 rounded-xl bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-[var(--pastel-accent)] flex items-center justify-center text-sm font-extrabold">
          K
        </span>
        <span>Kertas<span class="text-[var(--pastel-accent)]">Biru</span></span>
      </a>

      <div class="flex items-center gap-2">
        <button
          type="button"
          onclick="toggleSlideDrawer()"
          aria-label="Buka atau Tutup Menu Samping"
          class="px-3 py-1.5 rounded-xl bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-xs font-bold text-[var(--pastel-text)] cursor-pointer"
        >
          &#9776;
        </button>
        <button
          type="button"
          onclick="toggleTheme()"
          aria-label="Ganti Tema"
          class="px-3 py-1.5 rounded-xl bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-xs font-bold text-[var(--pastel-text)] cursor-pointer"
        >
          <span id="themeLabel">&#9790;</span>
        </button>
      </div>
    </div>

    <!-- Navigasi Utama -->
    <nav class="border-t border-[var(--pastel-border)] bg-[var(--pastel-card)]">
      <div class="max-w-6xl mx-auto px-4 py-2 flex items-center gap-2 overflow-x-auto text-sm font-semibold">
        <button
          type="button"
          id="nav-home"
          onclick="goHomePage(event)"
          class="px-3.5 py-1.5 rounded-xl bg-[var(--pastel-accent)] text-white whitespace-nowrap cursor-pointer"
        >
          Home
        </button>
        <button
          type="button"
          id="nav-catalog"
          onclick="openCatalogAZPage(event)"
          class="px-3.5 py-1.5 rounded-xl text-[var(--pastel-text)] hover:bg-[var(--pastel-soft)] whitespace-nowrap cursor-pointer"
        >
          Daftar Novel
        </button>
        <button
          type="button"
          id="nav-genre"
          onclick="openGenrePage(event)"
          class="px-3.5 py-1.5 rounded-xl text-[var(--pastel-text)] hover:bg-[var(--pastel-soft)] whitespace-nowrap cursor-pointer"
        >
          Genre
        </button>
        <button
          type="button"
          id="nav-bookmark"
          onclick="openBookmarksPage(event)"
          class="px-3.5 py-1.5 rounded-xl text-[var(--pastel-text)] hover:bg-[var(--pastel-soft)] whitespace-nowrap cursor-pointer"
        >
          Bookmark
        </button>
      </div>
    </nav>
  </header>

  <!-- Backdrop & Drawer Samping -->
  <div
    id="sideHalfBackdrop"
    onclick="toggleSlideDrawer(false)"
    class="hidden fixed inset-0 bg-slate-950/50 z-40"
  ></div>
  <aside
    id="sideHalfDrawer"
    aria-label="Menu Samping"
    class="fixed top-0 right-0 h-full w-72 max-w-[85vw] bg-[var(--pastel-card)] border-l border-[var(--pastel-border)] shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-out p-5 flex flex-col justify-between"
  >
    <div class="space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-[var(--pastel-border)]">
        <span class="font-extrabold text-base">Menu KertasBiru</span>
        <button
          type="button"
          onclick="toggleSlideDrawer(false)"
          class="w-8 h-8 rounded-full bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-sm font-bold cursor-pointer"
        >
          &times;
        </button>
      </div>
      <div class="flex flex-col gap-2 text-sm font-semibold">
        <button type="button" onclick="goHomePage(); toggleSlideDrawer(false);" class="text-left px-3.5 py-2 rounded-xl hover:bg-[var(--pastel-soft)] cursor-pointer">Home</button>
        <button type="button" onclick="openCatalogAZPage(); toggleSlideDrawer(false);" class="text-left px-3.5 py-2 rounded-xl hover:bg-[var(--pastel-soft)] cursor-pointer">Daftar Novel (A&ndash;Z)</button>
        <button type="button" onclick="openGenrePage(); toggleSlideDrawer(false);" class="text-left px-3.5 py-2 rounded-xl hover:bg-[var(--pastel-soft)] cursor-pointer">Genre</button>
        <button type="button" onclick="openBookmarksPage(); toggleSlideDrawer(false);" class="text-left px-3.5 py-2 rounded-xl hover:bg-[var(--pastel-soft)] cursor-pointer">Bookmark</button>
      </div>
    </div>
    <div class="text-xs text-[var(--pastel-muted)] pt-3 border-t border-[var(--pastel-border)]">
      KertasBiru &bull; Baca Novel Nyaman
    </div>
  </aside>

  <!-- Konten Utama -->
  <main id="appViewport" class="flex-1 max-w-6xl w-full mx-auto px-4 py-6"></main>

  <!-- Footer -->
  <footer class="bg-[var(--pastel-card)] border-t border-[var(--pastel-border)] py-5 px-4 mt-10 text-center text-xs text-[var(--pastel-muted)]">
    <p class="mb-2">&copy; KertasBiru &mdash; Platform Baca Novel.</p>
    <div class="flex items-center justify-center gap-4 font-semibold">
      <button type="button" onclick="goHomePage(event)" class="hover:text-[var(--pastel-accent)] cursor-pointer">Home</button>
      <button type="button" onclick="openCatalogAZPage(event)" class="hover:text-[var(--pastel-accent)] cursor-pointer">Daftar Novel</button>
      <button type="button" onclick="openBookmarksPage(event)" class="hover:text-[var(--pastel-accent)] cursor-pointer">Bookmark</button>
    </div>
  </footer>

  <script>
    const NOVEL_CONFIG = {
      siteName: "KertasBiru",
      bloggerUrl: "https://novelkutest.blogspot.com",
      defaultGenres: [
        "Romance",
        "Fantasi",
        "Action",
        "Drama",
        "Misteri",
        "Horor",
        "Komedi",
        "Sci-Fi",
        "Slice of Life",
        "Petualangan",
        "Sejarah",
        "Thriller"
      ]
    };

    const STORAGE_KEYS = {
      theme: "kertasbiru_dark_v1",
      bookmarks: "kertasbiru_bookmarks_v1",
      reads: "kertasbiru_reads_v1"
    };

    const APP_STATE = {
      view: "home",
      selectedNovelSlug: null,
      selectedChapterSlug: null,
      selectedGenre: "",
      selectedAZLetter: "ALL",
      homeSectionMode: "all",
      heroSlideIndex: 0,
      feedLoaded: false,
      seriesList: [],
      chapterList: [],
      audioTracks: [],
      genres: [...NOVEL_CONFIG.defaultGenres]
    };

    let bookmarkedSlugs = [];
    let readCounts = {};
    let heroIntervalId = null;
    let bgAudioPlayer = null;
    let currentAudioIndex = 0;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function slugify(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function stripHtml(html) {
      const div = document.createElement("div");
      div.innerHTML = String(html || "");
      return (div.textContent || div.innerText || "").trim();
    }

    function loadStorage() {
      try {
        const isDark = localStorage.getItem(STORAGE_KEYS.theme) === "1";
        document.documentElement.classList.toggle("dark", isDark);
        updateThemeLabel();
      } catch (e) {}

      try {
        const rawBm = JSON.parse(localStorage.getItem(STORAGE_KEYS.bookmarks) || "[]");
        bookmarkedSlugs = Array.isArray(rawBm) ? rawBm : [];
      } catch (e) {
        bookmarkedSlugs = [];
      }

      try {
        const rawReads = JSON.parse(localStorage.getItem(STORAGE_KEYS.reads) || "{}");
        readCounts = rawReads && typeof rawReads === "object" ? rawReads : {};
      } catch (e) {
        readCounts = {};
      }
    }

    function updateThemeLabel() {
      const label = document.getElementById("themeLabel");
      if (!label) return;
      const isDark = document.documentElement.classList.contains("dark");
      label.innerHTML = isDark ? "&#9728;" : "&#9790;";
    }

    function toggleTheme() {
      const nextDark = !document.documentElement.classList.contains("dark");
      document.documentElement.classList.toggle("dark", nextDark);
      try {
        localStorage.setItem(STORAGE_KEYS.theme, nextDark ? "1" : "0");
      } catch (e) {}
      updateThemeLabel();
      renderCurrentView();
    }

    function toggleSlideDrawer(forceState) {
      const drawer = document.getElementById("sideHalfDrawer");
      const backdrop = document.getElementById("sideHalfBackdrop");
      if (!drawer || !backdrop) return;
      const isOpen = !drawer.classList.contains("translate-x-full");
      const targetOpen = typeof forceState === "boolean" ? forceState : !isOpen;
      drawer.classList.toggle("translate-x-full", !targetOpen);
      backdrop.classList.toggle("hidden", !targetOpen);
    }

    function toggleBookmark(slug) {
      if (!slug) return;
      const idx = bookmarkedSlugs.indexOf(slug);
      if (idx >= 0) {
        bookmarkedSlugs.splice(idx, 1);
      } else {
        bookmarkedSlugs.push(slug);
      }
      try {
        localStorage.setItem(STORAGE_KEYS.bookmarks, JSON.stringify(bookmarkedSlugs));
      } catch (e) {}
      renderCurrentView();
    }

    function recordReadCount(slug) {
      if (!slug) return;
      readCounts[slug] = (Number(readCounts[slug]) || 0) + 1;
      try {
        localStorage.setItem(STORAGE_KEYS.reads, JSON.stringify(readCounts));
      } catch (e) {}
    }

    function extractAuthorLine(rawHtml) {
      const plain = stripHtml(rawHtml);
      const lines = plain
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter(Boolean);
      const found = lines.find((line) => /^penulis\s*:/i.test(line));
      return found ? found : "";
    }

    function extractCoverImage(rawHtml, fallbackText) {
      const imgMatch = String(rawHtml || "").match(/<img[^>]+src=["']([^"']+)["']/i);
      if (imgMatch && imgMatch[1]) return imgMatch[1];
      return `https://placehold.co/600x800/dcebfa/162b4d?text=${encodeURIComponent(fallbackText || "Poster")}`;
    }

    function extractSynopsis(rawHtml) {
      const plain = stripHtml(rawHtml);
      const cleanLines = plain
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l && !/^penulis\s*:/i.test(l));
      const joined = cleanLines.join(" ").trim();
      if (!joined) return "Sinopsis belum tersedia.";
      return joined.length > 130 ? `${joined.slice(0, 127).trim()}...` : joined;
    }

    function extractAudioUrls(rawHtml) {
      const urls = [];
      const matches = String(rawHtml || "").match(/https?:\/\/[^\s"'<>]+\.(?:mp3|ogg|wav|m4a)(?:\?[^\s"'<>]*)?/gi) || [];
      matches.forEach((u) => {
        if (!urls.includes(u)) urls.push(u);
      });
      return urls;
    }

    function parseBloggerEntries(entries) {
      const seriesMap = new Map();
      const chapters = [];
      const audioTracks = [];
      const genreSet = new Set(NOVEL_CONFIG.defaultGenres);

      (entries || []).forEach((entry, index) => {
        const title = (entry.title && entry.title.$t ? entry.title.$t : `Judul ${index + 1}`).trim();
        const contentHtml =
          (entry.content && entry.content.$t) ||
          (entry.summary && entry.summary.$t) ||
          "";
        const labels = (entry.category || [])
          .map((c) => (c.term || "").trim())
          .filter(Boolean);
        const lowerLabels = labels.map((l) => l.toLowerCase());
        const publishedAt = entry.published && entry.published.$t ? entry.published.$t : "";

        const foundAudios = extractAudioUrls(contentHtml);
        if (lowerLabels.includes("musik") || foundAudios.length > 0) {
          foundAudios.forEach((url, aIdx) => {
            audioTracks.push({
              id: `${slugify(title) || "track"}-${aIdx}`,
              title: foundAudios.length > 1 ? `${title} (${aIdx + 1})` : title,
              url
            });
          });
        }

        const isChapter =
          lowerLabels.includes("chapter") ||
          lowerLabels.includes("bab") ||
          /^bab\s*\d+/i.test(title);

        if (isChapter) {
          const seriesMatch = labels.find(
            (l) => !["chapter", "bab", "series", "novel", "tamat", "berlanjut", "musik"].includes(l.toLowerCase())
          );
          const seriesSlug = slugify(seriesMatch || title.split(/\s+bab\s+/i)[0] || "novel-utama");
          chapters.push({
            slug: slugify(`${seriesSlug}-${title}-${index}`),
            seriesSlug,
            title,
            contentHtml,
            publishedAt
          });
          return;
        }

        const isSeries =
          lowerLabels.includes("series") ||
          lowerLabels.includes("novel") ||
          !lowerLabels.includes("musik");

        if (isSeries) {
          const slug = slugify(title) || `novel-${index + 1}`;
          const isTamat = lowerLabels.includes("tamat") || /tamat/i.test(title);
          const novelGenres = labels.filter(
            (l) => !["series", "novel", "tamat", "berlanjut", "populer", "terbaru", "musik"].includes(l.toLowerCase())
          );
          novelGenres.forEach((g) => genreSet.add(g));

          seriesMap.set(slug, {
            slug,
            title,
            cover: extractCoverImage(contentHtml, title),
            synopsis: extractSynopsis(contentHtml),
            authorLine: extractAuthorLine(contentHtml),
            status: isTamat ? "Tamat" : "Berlanjut",
            genres: novelGenres.length ? novelGenres : ["Drama"],
            publishedAt,
            views: Number(readCounts[slug]) || Math.max(10, (entries.length - index) * 15)
          });
        }
      });

      APP_STATE.seriesList = Array.from(seriesMap.values());
      APP_STATE.chapterList = chapters;
      APP_STATE.audioTracks = audioTracks;
      APP_STATE.genres = Array.from(genreSet);
    }

    function getPopularSeries(limit) {
      const sorted = [...APP_STATE.seriesList].sort((a, b) => {
        const countA = (Number(readCounts[a.slug]) || 0) + (Number(a.views) || 0);
        const countB = (Number(readCounts[b.slug]) || 0) + (Number(b.views) || 0);
        return countB - countA;
      });
      return typeof limit === "number" ? sorted.slice(0, limit) : sorted;
    }

    function getLatestSeries(limit) {
      const sorted = [...APP_STATE.seriesList].sort((a, b) => {
        const timeA = Date.parse(a.publishedAt || "") || 0;
        const timeB = Date.parse(b.publishedAt || "") || 0;
        return timeB - timeA;
      });
      return typeof limit === "number" ? sorted.slice(0, limit) : sorted;
    }

    function getSeriesChapters(seriesSlug) {
      return APP_STATE.chapterList.filter((ch) => ch.seriesSlug === seriesSlug);
    }

    function loadBloggerJsonp(baseUrl) {
      return new Promise((resolve) => {
        const cbName = `kbBloggerFeedCb_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const timer = setTimeout(() => {
          cleanup();
          resolve(null);
        }, 6000);

        function cleanup() {
          clearTimeout(timer);
          try {
            delete window[cbName];
          } catch (e) {}
          if (scriptEl && scriptEl.parentNode) {
            scriptEl.parentNode.removeChild(scriptEl);
          }
        }

        window[cbName] = function (data) {
          cleanup();
          resolve(data);
        };

        const scriptEl = document.createElement("script");
        scriptEl.src = `${baseUrl}/feeds/posts/default?alt=json-in-script&max-results=150&callback=${cbName}`;
        scriptEl.onerror = () => {
          cleanup();
          resolve(null);
        };
        document.body.appendChild(scriptEl);
      });
    }

    async function loadBloggerData() {
      const baseUrl = String(NOVEL_CONFIG.bloggerUrl || "").trim().replace(/\/+$/, "");
      if (!baseUrl) {
        APP_STATE.feedLoaded = true;
        renderCurrentView();
        return;
      }

      let data = null;
      try {
        const res = await fetch(`${baseUrl}/feeds/posts/default?alt=json&max-results=150`);
        if (res.ok) {
          data = await res.json();
        }
      } catch (e) {}

      if (!data) {
        data = await loadBloggerJsonp(baseUrl);
      }

      const entries = (data && data.feed && data.feed.entry) || [];
      parseBloggerEntries(entries);
      APP_STATE.feedLoaded = true;
      renderCurrentView();
    }

    function setActiveNavButton(activeKey) {
      const keys = ["home", "catalog", "genre", "bookmark"];
      keys.forEach((k) => {
        const btn = document.getElementById(`nav-${k}`);
        if (!btn) return;
        if (k === activeKey) {
          btn.className = "px-3.5 py-1.5 rounded-xl bg-[var(--pastel-accent)] text-white whitespace-nowrap cursor-pointer";
        } else {
          btn.className = "px-3.5 py-1.5 rounded-xl text-[var(--pastel-text)] hover:bg-[var(--pastel-soft)] whitespace-nowrap cursor-pointer";
        }
      });
    }

    function stopHeroTimer() {
      if (heroIntervalId) {
        clearInterval(heroIntervalId);
        heroIntervalId = null;
      }
    }

    function startHeroTimer(totalSlides) {
      stopHeroTimer();
      if (APP_STATE.view !== "home" || APP_STATE.homeSectionMode !== "all" || totalSlides <= 1) return;
      heroIntervalId = setInterval(() => {
        const topFiveCount = Math.min(5, getPopularSeries().length);
        if (topFiveCount > 1 && APP_STATE.view === "home" && APP_STATE.homeSectionMode === "all") {
          APP_STATE.heroSlideIndex = (APP_STATE.heroSlideIndex + 1) % topFiveCount;
          renderCurrentView();
        }
      }, 5000);
    }

    function nextHeroSlide() {
      const topFiveCount = Math.min(5, getPopularSeries().length);
      if (!topFiveCount) return;
      APP_STATE.heroSlideIndex = (APP_STATE.heroSlideIndex + 1) % topFiveCount;
      renderCurrentView();
    }

    function prevHeroSlide() {
      const topFiveCount = Math.min(5, getPopularSeries().length);
      if (!topFiveCount) return;
      APP_STATE.heroSlideIndex = (APP_STATE.heroSlideIndex - 1 + topFiveCount) % topFiveCount;
      renderCurrentView();
    }

    function goHomePage(event) {
      if (event) event.preventDefault();
      APP_STATE.view = "home";
      APP_STATE.homeSectionMode = "all";
      APP_STATE.selectedGenre = "";
      setActiveNavButton("home");
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openSectionList(mode) {
      APP_STATE.view = "home";
      APP_STATE.homeSectionMode = mode;
      setActiveNavButton("home");
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openCatalogAZPage(event) {
      if (event) event.preventDefault();
      stopHeroTimer();
      APP_STATE.view = "catalog";
      APP_STATE.selectedAZLetter = "ALL";
      setActiveNavButton("catalog");
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectAZLetter(letter) {
      APP_STATE.selectedAZLetter = letter;
      renderCurrentView();
    }

    function openGenrePage(event, presetGenre) {
      if (event) event.preventDefault();
      stopHeroTimer();
      APP_STATE.view = "genre";
      APP_STATE.selectedGenre = typeof presetGenre === "string" ? presetGenre : "";
      setActiveNavButton("genre");
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openBookmarksPage(event) {
      if (event) event.preventDefault();
      stopHeroTimer();
      APP_STATE.view = "bookmark";
      setActiveNavButton("bookmark");
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openNovelDetail(slug) {
      stopHeroTimer();
      APP_STATE.view = "detail";
      APP_STATE.selectedNovelSlug = slug;
      recordReadCount(slug);
      setActiveNavButton("catalog");
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openChapterReader(novelSlug, chapterSlug) {
      stopHeroTimer();
      APP_STATE.view = "reader";
      APP_STATE.selectedNovelSlug = novelSlug;
      APP_STATE.selectedChapterSlug = chapterSlug;
      recordReadCount(novelSlug);
      setActiveNavButton("catalog");
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function ensureAudioPlayer() {
      if (!bgAudioPlayer) {
        bgAudioPlayer = new Audio();
        bgAudioPlayer.loop = false;
        bgAudioPlayer.addEventListener("ended", () => {
          if (APP_STATE.audioTracks.length > 0) {
            currentAudioIndex = (currentAudioIndex + 1) % APP_STATE.audioTracks.length;
            bgAudioPlayer.src = APP_STATE.audioTracks[currentAudioIndex].url;
            bgAudioPlayer.play().catch(() => {});
            renderCurrentView();
          }
        });
      }
      return bgAudioPlayer;
    }

    function toggleMusicTrack(index) {
      const tracks = APP_STATE.audioTracks || [];
      if (!tracks.length) return;
      const player = ensureAudioPlayer();
      const targetIdx = typeof index === "number" ? index : currentAudioIndex;
      if (currentAudioIndex === targetIdx && !player.paused) {
        player.pause();
      } else {
        currentAudioIndex = targetIdx;
        if (player.src !== tracks[currentAudioIndex].url) {
          player.src = tracks[currentAudioIndex].url;
        }
        player.play().catch(() => {});
      }
      renderCurrentView();
    }

    function renderMusicBar() {

      return `

    function renderDetailView(viewport) {
      const novel =
        APP_STATE.seriesList.find((n) => n.slug === APP_STATE.selectedNovelSlug) ||
        APP_STATE.seriesList[0];

      if (!novel) {
        viewport.innerHTML = `
          <div class="bg-[var(--pastel-card)] border border-[var(--pastel-border)] rounded-2xl p-8 text-center space-y-3">
            <p class="text-sm text-[var(--pastel-muted)]">Novel tidak ditemukan.</p>
            <button type="button" onclick="goHomePage()" class="px-4 py-2 rounded-xl bg-[var(--pastel-accent)] text-white text-xs font-bold cursor-pointer">&larr; Kembali ke Home</button>
          </div>
        `;
        return;
      }

      const chapters = getSeriesChapters(novel.slug);
      const saved = bookmarkedSlugs.includes(novel.slug);

      viewport.innerHTML = `
        <div class="mb-4 flex items-center justify-between gap-2">
          <button
            type="button"
            onclick="goHomePage()"
            class="px-3.5 py-2 rounded-xl bg-[var(--pastel-card)] border border-[var(--pastel-border)] text-xs font-bold hover:border-[var(--pastel-accent)] cursor-pointer"
          >
            &larr; Kembali ke Home
          </button>
        </div>

        <article class="bg-[var(--pastel-card)] border border-[var(--pastel-border)] rounded-3xl p-5 grid grid-cols-1 sm:grid-cols-[170px_minmax(0,1fr)] gap-5 shadow-sm">
          <div class="w-40 sm:w-full aspect-[3/4] rounded-2xl overflow-hidden border border-[var(--pastel-border)] bg-[var(--pastel-soft)] mx-auto sm:mx-0">
            <img
              src="${escapeHtml(novel.cover)}"
              alt="${escapeHtml(novel.title)}"
              onerror="this.onerror=null;this.src='https://placehold.co/600x800/dcebfa/162b4d?text=Poster';"
              class="w-full h-full object-cover object-top block"
            />
          </div>

          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-2">
              ${renderStatusBadge(novel.status)}
              ${(novel.genres || [])
                .map(
                  (g) => `
                <button
                  type="button"
                  onclick="openGenrePage(event, '${escapeHtml(g)}')"
                  class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-[var(--pastel-soft)] text-[var(--pastel-accent)] cursor-pointer"
                >
                  ${escapeHtml(g)}
                </button>
              `
                )
                .join("")}
            </div>

            <h1 class="text-xl sm:text-2xl font-extrabold text-[var(--pastel-text)] leading-tight">${escapeHtml(novel.title)}</h1>
            ${novel.authorLine ? `<p class="text-xs text-[var(--pastel-muted)] mt-1">${escapeHtml(novel.authorLine)}</p>` : ""}

            <p class="text-sm text-[var(--pastel-muted)] mt-3 leading-relaxed">${escapeHtml(novel.synopsis)}</p>

            <div class="flex flex-wrap items-center gap-2.5 mt-4">
              ${
                chapters.length
                  ? `<button type="button" onclick="openChapterReader('${escapeHtml(novel.slug)}', '${escapeHtml(chapters[0].slug)}')" class="px-4 py-2 rounded-xl bg-[var(--pastel-accent)] text-white text-xs font-bold cursor-pointer">Mulai Baca ${escapeHtml(chapters[0].title)}</button>`
                  : ""
              }
              <button
                type="button"
                onclick="toggleBookmark('${escapeHtml(novel.slug)}')"
                class="px-4 py-2 rounded-xl bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-xs font-bold cursor-pointer"
              >
                ${saved ? "&#9733; Tersimpan" : "&#9734; Simpan Bookmark"}
              </button>
            </div>
          </div>
        </article>

        <section class="bg-[var(--pastel-card)] border border-[var(--pastel-border)] rounded-2xl p-4 sm:p-5 mt-5">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-extrabold">Daftar Bab (${chapters.length})</h2>
            <span class="text-[11px] text-[var(--pastel-muted)]">Geser / gulir ke bawah</span>
          </div>
          ${
            chapters.length
              ? `<div class="chapter-scroll-box divide-y divide-[var(--pastel-border)] border border-[var(--pastel-border)] rounded-xl">
                  ${chapters
                    .map(
                      (ch) => `
                    <button
                      type="button"
                      onclick="openChapterReader('${escapeHtml(novel.slug)}', '${escapeHtml(ch.slug)}')"
                      class="w-full px-3.5 py-2.5 text-left text-xs sm:text-sm font-semibold hover:bg-[var(--pastel-soft)] flex items-center justify-between gap-2 cursor-pointer"
                    >
                      <span class="truncate">${escapeHtml(ch.title)}</span>
                      <span class="text-[var(--pastel-accent)] text-xs font-bold shrink-0">Baca &rsaquo;</span>
                    </button>
                  `
                    )
                    .join("")}
                 </div>`
              : `<p class="text-xs text-[var(--pastel-muted)]">Belum ada bab tersedia untuk novel ini.</p>`
          }
        </section>
      `;
    }

    function renderReaderView(viewport) {
      const novel = APP_STATE.seriesList.find((n) => n.slug === APP_STATE.selectedNovelSlug);
      const chapters = novel ? getSeriesChapters(novel.slug) : [];
      const chapter =
        chapters.find((c) => c.slug === APP_STATE.selectedChapterSlug) || chapters[0];

      viewport.innerHTML = `
        <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
          <button
            type="button"
            onclick="goHomePage()"
            class="px-3.5 py-2 rounded-xl bg-[var(--pastel-card)] border border-[var(--pastel-border)] text-xs font-bold hover:border-[var(--pastel-accent)] cursor-pointer"
          >
            &larr; Kembali ke Home
          </button>
          ${
            novel
              ? `<button type="button" onclick="openNovelDetail('${escapeHtml(novel.slug)}')" class="px-3.5 py-2 rounded-xl bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-xs font-bold cursor-pointer">Detail Novel</button>`
              : ""
          }
        </div>

        <article class="bg-[var(--pastel-card)] border border-[var(--pastel-border)] rounded-3xl p-5 sm:p-7 shadow-sm">
          ${novel ? `<p class="text-xs font-bold text-[var(--pastel-accent)] mb-1">${escapeHtml(novel.title)}</p>` : ""}
          <h1 class="text-xl sm:text-2xl font-extrabold pb-3 mb-5 border-b border-[var(--pastel-border)]">
            ${escapeHtml(chapter ? chapter.title : "Bab Novel")}
          </h1>
          <div class="reader-prose text-base sm:text-lg leading-relaxed space-y-4">
            ${
              chapter && chapter.contentHtml
                ? chapter.contentHtml
                : `<p class="text-sm text-[var(--pastel-muted)]">Isi bab belum tersedia.</p>`
            }
          </div>
        </article>
      `;
    }

    function renderCurrentView() {
      const viewport = document.getElementById("appViewport");
      if (!viewport) return;

      if (APP_STATE.view === "catalog") {
        renderCatalogAZView(viewport);
      } else if (APP_STATE.view === "genre") {
        renderGenreView(viewport);
      } else if (APP_STATE.view === "bookmark") {
        renderBookmarkView(viewport);
      } else if (APP_STATE.view === "detail") {
        renderDetailView(viewport);
      } else if (APP_STATE.view === "reader") {
        renderReaderView(viewport);
      } else {
        renderHomeView(viewport);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadStorage();
      loadBloggerData();
    });
  </script>
</body>
</html>
