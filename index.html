
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KertasBiru &mdash; Platform Baca Novel</title>
  <link id="siteFavicon" rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --pastel-bg: #f3f8fe;
      --pastel-card: #ffffff;
      --pastel-soft: #e3effd;
      --pastel-border: #c5daf5;
      --pastel-text: #162b4d;
      --pastel-muted: #526d96;
      --pastel-accent: #2563eb;
      --pastel-accent-hover: #1d4ed8;
    }

    html.dark {
      --pastel-bg: #0b1324;
      --pastel-card: #121e36;
      --pastel-soft: #1a2b4c;
      --pastel-border: #243b66;
      --pastel-text: #eef4ff;
      --pastel-muted: #93aed6;
      --pastel-accent: #3b82f6;
      --pastel-accent-hover: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--pastel-bg);
      color: var(--pastel-text);
      line-height: 1.7;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .font-reading {
      font-family: 'Lora', Georgia, Cambria, serif;
    }

    .frosted-glass-panel {
      background-color: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }

    html.dark .frosted-glass-panel {
      background-color: rgba(18, 30, 54, 0.76);
    }

    @keyframes slideFadeIn {
      0% {
        opacity: 0;
        transform: translateX(16px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .hero-slide-enter {
      animation: slideFadeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .ad-slot-wrapper {
      width: 100%;
      margin: 18px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      clear: both;
    }

    .ad-slot-wrapper.is-hidden {
      display: none !important;
    }

    .ad-slot-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--pastel-muted);
      margin-bottom: 6px;
    }

    .ad-slot-box {
      width: 100%;
      min-height: 84px;
      background-color: var(--pastel-card);
      border: 1.5px dashed var(--pastel-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--pastel-muted);
      font-size: 12px;
      overflow: hidden;
    }

    .ad-slot-box code {
      background-color: var(--pastel-soft);
      color: var(--pastel-text);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 11px;
    }

    .pastel-modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(11, 19, 36, 0.65);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .pastel-modal-backdrop.is-open {
      display: flex;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER UTAMA -->
  <header class="sticky top-0 z-30 bg-[var(--pastel-card)]/95 backdrop-blur border-b border-[var(--pastel-border)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-2">
      <a href="#home" onclick="return goHomePage(event)" class="flex items-center gap-2 text-base sm:text-xl font-extrabold tracking-tight text-[var(--pastel-text)] shrink-0">
        <span class="w-8 h-8 rounded-xl bg-[var(--pastel-soft)] border border-[var(--pastel-border)] flex items-center justify-center text-[var(--pastel-accent)] font-black">
          K
        </span>
        <span>Kertas<span class="text-[var(--pastel-accent)]">Biru</span></span>
      </a>

      <div class="flex items-center gap-2 shrink-0">
        <button
          type="button"
          id="slideDrawerToggleBtn"
          aria-label="Buka atau Tutup Panel Samping"
          onclick="toggleSlideDrawer()"
          class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-[var(--pastel-soft)] hover:opacity-90 text-[var(--pastel-text)] border border-[var(--pastel-border)] transition inline-flex items-center gap-1.5 cursor-pointer"
        >
          <span>&#9776;</span>
          <span class="hidden sm:inline">Panel</span>
        </button>

        <button
          type="button"
          id="themeToggleBtn"
          aria-label="Ganti Mode Gelap atau Terang"
          onclick="toggleThemeMode()"
          class="px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-[var(--pastel-soft)] hover:opacity-90 text-[var(--pastel-text)] border border-[var(--pastel-border)] transition inline-flex items-center gap-1.5 cursor-pointer"
        >
          <span id="themeToggleIcon">&#9789;</span>
          <span id="themeToggleLabel" class="hidden sm:inline">Mode Gelap</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MENU BAR ATAS -->
  <nav aria-label="Menu Bar Atas" class="relative z-20 bg-[var(--pastel-card)] border-b border-[var(--pastel-border)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex items-center gap-2 overflow-x-auto">
      <button
        type="button"
        id="topbar-home"
        onclick="goHomePage()"
        class="topbar-link px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition cursor-pointer"
      >
        Home
      </button>
      <button
        type="button"
        id="topbar-catalog"
        onclick="openCatalogPage()"
        class="topbar-link px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition cursor-pointer"
      >
        Daftar Novel
      </button>
      <button
        type="button"
        id="topbar-genre"
        onclick="toggleHomeGenrePicker()"
        class="topbar-link px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition cursor-pointer"
      >
        Genre
      </button>
      <button
        type="button"
        id="topbar-bookmarks"
        onclick="openBookmarksPage()"
        class="topbar-link px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition inline-flex items-center gap-1.5 cursor-pointer"
      >
        <span>Bookmark</span>
        <span id="topbarBookmarkBadge" class="text-[11px] px-1.5 py-0.5 rounded-full bg-[var(--pastel-soft)] text-[var(--pastel-accent)] font-bold">0</span>
      </button>
    </div>
  </nav>

  <!-- BACKDROP & PANEL SAMPING SETENGAH LAYAR -->
  <div id="sideHalfBackdrop" onclick="toggleSlideDrawer(false)" class="hidden fixed inset-0 bg-slate-950/50 z-40"></div>
  <aside
    id="sideHalfDrawer"
    aria-label="Panel Samping Setengah Layar"
    style="transform: translateX(100%);"
    class="fixed top-0 right-0 h-full w-1/2 min-w-[260px] max-w-[460px] bg-[var(--pastel-card)] border-l border-[var(--pastel-border)] shadow-2xl z-50 transition-transform duration-300 ease-out flex flex-col justify-between p-5 overflow-y-auto"
  >
    <div class="space-y-5">
      <div class="flex items-center justify-between border-b border-[var(--pastel-border)] pb-3">
        <div>
          <p class="text-[11px] font-bold uppercase tracking-wider text-[var(--pastel-accent)]">Panel Samping</p>
          <h2 class="text-base font-extrabold text-[var(--pastel-text)]">Cari &amp; Genre</h2>
        </div>
        <button
          type="button"
          aria-label="Tutup Panel Samping"
          onclick="toggleSlideDrawer(false)"
          class="w-8 h-8 rounded-lg bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-sm font-bold flex items-center justify-center hover:border-[var(--pastel-accent)] cursor-pointer"
        >
          &#10005;
        </button>
      </div>

      <div>
        <label for="drawerSearchInput" class="block text-xs font-bold text-[var(--pastel-text)] mb-2">Cari Judul Novel</label>
        <input
          type="search"
          id="drawerSearchInput"
          oninput="handleSearchInput(this.value)"
          placeholder="Ketik judul novel..."
          class="w-full px-3.5 py-2 rounded-xl bg-[var(--pastel-bg)] border border-[var(--pastel-border)] text-sm text-[var(--pastel-text)] focus:outline-none focus:border-[var(--pastel-accent)]"
        />
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-bold text-[var(--pastel-text)]">Semua Genre</h3>
          <button
            type="button"
            onclick="selectGenreFilter('')"
            class="text-xs font-semibold text-[var(--pastel-accent)] hover:underline cursor-pointer"
          >
            Semua
          </button>
        </div>
        <div id="drawerGenreList" class="flex flex-wrap gap-2"></div>
      </div>
    </div>

    <div class="pt-4 border-t border-[var(--pastel-border)] text-xs text-[var(--pastel-muted)]">
      Klik genre untuk menyaring novel langsung di Home.
    </div>
  </aside>

  <!-- KONTENER UTAMA -->
  <div id="mainLayoutGrid" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_300px] gap-6">
    <!-- KONTEN UTAMA DI ATAS PADA HP -->
    <main id="appViewport" class="min-w-0 order-1 lg:order-none"></main>

    <!-- SIDEBAR DI BAWAH KONTEN PADA HP, DI KANAN PADA DESKTOP -->
    <aside id="rightSidebar" class="space-y-5 order-2 lg:order-none">
      <div class="bg-[var(--pastel-card)] border border-[var(--pastel-border)] rounded-2xl p-5 shadow-sm space-y-5">
        <div>
          <h2 class="text-sm font-bold text-[var(--pastel-text)] mb-2">Cari Judul Novel</h2>
          <input
            type="search"
            id="sidebarSearchInput"
            oninput="handleSearchInput(this.value)"
            placeholder="Ketik judul novel..."
            class="w-full px-3.5 py-2 rounded-xl bg-[var(--pastel-bg)] border border-[var(--pastel-border)] text-sm text-[var(--pastel-text)] focus:outline-none focus:border-[var(--pastel-accent)]"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm font-bold text-[var(--pastel-text)]">Cari Genre</h2>
            <button
              type="button"
              onclick="selectGenreFilter('')"
              class="text-xs font-semibold text-[var(--pastel-accent)] hover:underline cursor-pointer"
            >
              Reset
            </button>
          </div>
          <div id="sidebarGenreList" class="flex flex-wrap gap-2"></div>
        </div>
      </div>

      <div id="sidebarAdTopHost"></div>
      <div id="sidebarAdMiddleHost"></div>
      <div id="sidebarAdBottomHost"></div>
    </aside>
  </div>

  <!-- MODAL POP-UP -->
  <div id="popupModalBackdrop" class="pastel-modal-backdrop" role="dialog" aria-modal="true">
    <div class="relative w-full max-w-md bg-[var(--pastel-card)] border border-[var(--pastel-border)] rounded-2xl p-6 shadow-xl">
      <button
        type="button"
        id="popupModalCloseBtn"
        aria-label="Tutup Pop-up"
        class="absolute top-3.5 right-3.5 w-9 h-9 rounded-full bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-[var(--pastel-text)] font-bold flex items-center justify-center hover:bg-[var(--pastel-accent)] hover:text-white transition cursor-pointer"
      >
        &#10005;
      </button>
      <div id="popupModalBody"></div>
    </div>
  </div>

  <!-- MODAL PREFERENSI -->
  <div id="prefModalBackdrop" class="pastel-modal-backdrop" role="dialog" aria-modal="true">
    <div class="relative w-full max-w-md bg-[var(--pastel-card)] border border-[var(--pastel-border)] rounded-2xl p-6 shadow-xl">
      <button
        type="button"
        id="prefModalCloseBtn"
        aria-label="Tutup Pengaturan"
        class="absolute top-3.5 right-3.5 w-9 h-9 rounded-full bg-[var(--pastel-soft)] border border-[var(--pastel-border)] text-[var(--pastel-text)] font-bold flex items-center justify-center hover:bg-[var(--pastel-accent)] hover:text-white transition cursor-pointer"
      >
        &#10005;
      </button>

      <h2 class="text-lg font-bold text-[var(--pastel-text)] mb-1">Preferensi Tampilan &amp; Iklan</h2>
      <p class="text-xs text-[var(--pastel-muted)] mb-4">Atur kenyamanan tampilan pop-up dan sidebar.</p>

      <div class="space-y-3 text-sm border-y border-[var(--pastel-border)] py-4">
        <label class="flex items-center justify-between cursor-pointer">
          <span>Tampilkan Pop-up</span>
          <input type="checkbox" id="prefPopupCheck" class="w-4 h-4 accent-[#2563eb]" />
        </label>
        <label class="flex items-center justify-between cursor-pointer">
          <span>Tampilkan Promotional Popup</span>
          <input type="checkbox" id="prefPromoCheck" class="w-4 h-4 accent-[#2563eb]" />
        </label>
        <label class="flex items-center justify-between cursor-pointer">
          <span>Tampilkan Sidebar</span>
          <input type="checkbox" id="prefSidebarCheck" class="w-4 h-4 accent-[#2563eb]" />
        </label>
      </div>

      <div class="mt-5 flex justify-end">
        <button
          type="button"
          id="savePrefBtn"
          class="px-4 py-2 rounded-xl bg-[var(--pastel-accent)] hover:bg-[var(--pastel-accent-hover)] text-white text-sm font-semibold transition cursor-pointer"
        >
          Simpan Pengaturan
        </button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-[var(--pastel-card)] border-t border-[var(--pastel-border)] py-6 px-4 text-center text-xs sm:text-sm text-[var(--pastel-muted)] mt-10">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div>&copy; <span id="footerYear"></span> KertasBiru &mdash; Platform Baca Novel.</div>
      <nav aria-label="Navigasi Footer" class="flex items-center gap-4 font-semibold">
        <button type="button" onclick="goHomePage()" class="hover:text-[var(--pastel-accent)] cursor-pointer">Home</button>
        <button type="button" onclick="openCatalogPage()" class="hover:text-[var(--pastel-accent)] cursor-pointer">Daftar Novel</button>
        <button type="button" onclick="openBookmarksPage()" class="hover:text-[var(--pastel-accent)] cursor-pointer">Bookmark</button>
      </nav>
    </div>
  </footer>

  <script>
    const SITE_CONFIG = {
      bloggerUrl: "https://novelkutest.blogspot.com"
    };

    const ALL_GENRES = [
      "Romance",
      "Fantasi",
      "Action",
      "Drama",
      "Misteri",
      "Horor",
      "Komedi",
      "Sci-Fi",
      "Slice of Life",
      "Petualangan",
      "Sejarah",
      "Thriller"
    ];

    const MONETIZATION_CONFIG = {
      groups: {
        home: true,
        catalog: true,
        detail: true,
        reader: true,
        sidebar: true
      },
      slots: {
        home_below_hero: { enabled: true, code: "" },
        home_between_popular_latest: { enabled: true, code: "" },
        home_before_footer: { enabled: true, code: "" },
        catalog_top: { enabled: true, code: "" },
        catalog_after_rows: { enabled: true, code: "" },
        detail_below_synopsis: { enabled: true, code: "" },
        detail_above_chapter_list: { enabled: true, code: "" },
        detail_below_chapter_list: { enabled: true, code: "" },
        reader_above_title: { enabled: true, code: "" },
        reader_below_content: { enabled: true, code: "" },
        sidebar_top: { enabled: true, code: "" },
        sidebar_middle: { enabled: true, code: "" },
        sidebar_bottom: { enabled: true, code: "" }
      },
      popups: {
        welcome: {
          enabled: true,
          delayMs: 3500,
          badge: "Selamat Datang",
          title: "Selamat Datang di KertasBiru",
          description: "Baca novel favoritmu dengan tampilan poster yang rapi, mode gelap/terang, dan bookmark.",
          ctaText: "Mulai Membaca"
        },
        promotional: {
          enabled: true,
          delayMs: 14000,
          badge: "Pembaruan Bab",
          title: "Cek Judul Populer & Terbaru",
          description: "Temukan novel berstatus Tamat maupun Berlanjut dan simpan favoritmu ke Bookmark.",
          ctaText: "Lihat Daftar Novel"
        }
      }
    };

    const APP_STATE = {
      view: "home", // "home" | "section_popular" | "section_latest" | "catalog" | "bookmarks" | "detail" | "reader"
      selectedNovelSlug: "",
      selectedChapterSlug: "",
      selectedGenre: "",
      selectedLetter: "",
      genrePickerOpen: false,
      searchQuery: "",
      heroSlideIndex: 0,
      seriesList: [],
      chapterList: [],
      musicTracks: [],
      genres: ALL_GENRES.slice()
    };

    const PREF_KEY = "kertasbiru_prefs_v2";
    const BOOKMARK_KEY = "kertasbiru_bookmarks_v2";

    let userPrefs = {
      darkMode: false,
      popupEnabled: true,
      promoEnabled: true,
      sidebarEnabled: true
    };

    let bookmarkedSlugs = [];
    let isSlideDrawerOpen = false;
    let activePopupType = null;
    let heroTimer = null;
    let audioPlayer = null;
    let currentTrackIdx = 0;
    let isAudioPlaying = false;

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function slugify(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") || "novel";
    }

    function showToast(msg) {
      const old = document.getElementById("kertasbiruToast");
      if (old) old.remove();
      const toast = document.createElement("div");
      toast.id = "kertasbiruToast";
      toast.className = "fixed bottom-4 left-1/2 -translate-x-1/2 z-[10000] px-4 py-2.5 rounded-xl bg-[var(--pastel-card)] border border-[var(--pastel-border)] text-xs font-semibold text-[var(--pastel-text)] shadow-lg max-w-[92vw]";
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 3000);
    }

    function loadPrefs() {
      try {
        const raw = localStorage.getItem(PREF_KEY);
        if (raw) userPrefs = Object.assign({}, userPrefs, JSON.parse(raw));
      } catch (e) {}
    }

    function savePrefs() {
      try {
        localStorage.setItem(PREF_KEY, JSON.stringify(userPrefs));
      } catch (e) {}
    }

    function applyTheme() {
      document.documentElement.classList.toggle("dark", Boolean(userPrefs.darkMode));
      const icon = document.getElementById("themeToggleIcon");
      const label = document.getElementById("themeToggleLabel");
      if (icon) icon.innerHTML = userPrefs.darkMode ? "&#9728;" : "&#9789;";
      if (label) label.textContent = userPrefs.darkMode ? "Mode Terang" : "Mode Gelap";
    }

    function toggleThemeMode() {
      userPrefs.darkMode = !userPrefs.darkMode;
      savePrefs();
      applyTheme();
    }

    function applySidebar() {
      const sidebar = document.getElementById("rightSidebar");
      const grid = document.getElementById("mainLayoutGrid");
      if (!sidebar || !grid) return;
      if (userPrefs.sidebarEnabled) {
        sidebar.classList.remove("hidden");
        grid.className = "flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_300px] gap-6";
      } else {
        sidebar.classList.add("hidden");
        grid.className = "flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 gap-6";
      }
    }

    function loadBookmarks() {
      try {
        const raw = localStorage.getItem(BOOKMARK_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        bookmarkedSlugs = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        bookmarkedSlugs = [];
      }
      refreshBookmarkBadge();
    }

    function saveBookmarks() {
      try {
        localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmarkedSlugs));
      } catch (e) {}
      refreshBookmarkBadge();
    }

    function refreshBookmarkBadge() {
      const badge = document.getElementById("topbarBookmarkBadge");
      if (badge) badge.textContent = String(bookmarkedSlugs.length);
    }

    function toggleBookmark(slug) {
      if (!slug) return;
      const idx = bookmarkedSlugs.indexOf(slug);
      if (idx === -1) {
        bookmarkedSlugs.push(slug);
        showToast("Novel disimpan ke Bookmark.");
      } else {
        bookmarkedSlugs.splice(idx, 1);
        showToast("Novel dihapus dari Bookmark.");
      }
      saveBookmarks();
      renderView();
    }

    function toggleSlideDrawer(forceState) {
      const drawer = document.getElementById("sideHalfDrawer");
      const backdrop = document.getElementById("sideHalfBackdrop");
      if (!drawer || !backdrop) return;
      isSlideDrawerOpen = typeof forceState === "boolean" ? forceState : !isSlideDrawerOpen;
      drawer.style.transform = isSlideDrawerOpen ? "translateX(0)" : "translateX(100%)";
      backdrop.classList.toggle("hidden", !isSlideDrawerOpen);
    }

    function setActiveNav(key) {
      document.querySelectorAll(".topbar-link").forEach((btn) => {
        btn.classList.remove("bg-[var(--pastel-accent)]", "text-white");
        btn.classList.add("text-[var(--pastel-text)]");
      });
      const el = document.getElementById("topbar-" + key);
      if (el) {
        el.classList.remove("text-[var(--pastel-text)]");
        el.classList.add("bg-[var(--pastel-accent)]", "text-white");
      }
    }

    function goHomePage(event) {
      if (event) event.preventDefault();
      APP_STATE.view = "home";
      APP_STATE.selectedGenre = "";
      APP_STATE.genrePickerOpen = false;
      APP_STATE.searchQuery = "";
      const s1 = document.getElementById("sidebarSearchInput");
      const s2 = document.getElementById("drawerSearchInput");
      if (s1) s1.value = "";
      if (s2) s2.value = "";
      renderGenrePills();
      renderView();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return false;
    }

    function openSectionPage(sectionKey) {
      APP_STATE.view = sectionKey === "popular" ? "section_popular" : "section_latest";
      APP_STATE.selectedGenre = "";
      renderView();

    function extractFirstImage(html) {
      const box = document.createElement("div");
      box.innerHTML = html || "";

      return img ? (img.getAttribute("src") || "") : "";
    }

    function extractAudioList(html) {
      const found = [];
      const box = document.createElement("div");
      box.innerHTML = html || "";
      box.querySelectorAll("audio, audio source, a[href]").forEach((el) => {
        const src = (el.getAttribute("src") || el.getAttribute("href") || "").trim();
        if (/\.(mp3|ogg|wav|m4a|aac)(\?|#|$)/i.test(src)) {
          found.push(src);
        }
      });
      const text = box.textContent || "";
      const matches = text.match(/https?:\/\/[^\s"'<>]+\.(?:mp3|ogg|wav|m4a|aac)(?:\?[^\s"'<>]*)?/gi) || [];
      matches.forEach((u) => found.push(u.trim()));
      return Array.from(new Set(found));
    }

    function htmlToPlainText(html) {
      const box = document.createElement("div");
      box.innerHTML = html || "";
      return (box.textContent || box.innerText || "").replace(/\r\n/g, "\n").trim();
    }

    function parseAuthorAndSynopsis(plainText, feedAuthorName) {
      const lines = String(plainText || "")
        .split("\n")
        .map((l) => l.trim())
        .filter(Boolean);

      let authorLine = "";
      const bodyLines = [];

      lines.forEach((line) => {
        const match = line.match(/^(?:penulis|author|karya|oleh)\s*[:\-]\s*(.+)$/i);
        if (match && !authorLine) {
          authorLine = `Penulis: ${match[1].trim()}`;
        } else {
          bodyLines.push(line);
        }
      });

      const cleanFeedAuthor = String(feedAuthorName || "").trim();
      const isPlaceholderAuthor = !cleanFeedAuthor || /^novellink$/i.test(cleanFeedAuthor);

      return {
        authorLine: authorLine || (isPlaceholderAuthor ? "" : `Penulis: ${cleanFeedAuthor}`),
        synopsis: bodyLines.join("\n").trim() || "Sinopsis belum tersedia."
      };
    }

    function parseBloggerFeed(entries) {
      const seriesMap = new Map();
      const fallbackSeries = [];
      const chapters = [];
      const tracks = [];
      const genreSet = new Set(ALL_GENRES);

      (entries || []).forEach((entry, idx) => {
        const title = (entry.title && entry.title.$t ? entry.title.$t : `Postingan ${idx + 1}`).trim();
        const htmlContent = (entry.content && entry.content.$t) || (entry.summary && entry.summary.$t) || "";
        const plainText = htmlToPlainText(htmlContent);
        const labels = (entry.category || []).map((c) => String(c.term || "").trim()).filter(Boolean);
        const lowerLabels = labels.map((l) => l.toLowerCase());

        const isMusic = lowerLabels.includes("musik") || lowerLabels.includes("music") || lowerLabels.includes("audio");
        if (isMusic) {
          const urls = extractAudioList(htmlContent);
          urls.forEach((u, i) => {
            tracks.push({
              title: urls.length > 1 ? `${title} (${i + 1})` : title,
              url: u
            });
          });
          return;
        }

        const cover =
          (entry.media$thumbnail && entry.media$thumbnail.url ? entry.media$thumbnail.url.replace(/\/s\d+(-c)?\//, "/s800/") : "") ||
          extractFirstImage(htmlContent) ||
          `https://placehold.co/600x900/dcebfa/162b4d?text=${encodeURIComponent(title.slice(0, 16))}`;

        const metaLabels = new Set(["series", "novel", "chapter", "bab", "tamat", "berlanjut", "ongoing", "completed", "populer", "popular"]);
        const genres = labels.filter((l) => !metaLabels.has(l.toLowerCase()));
        genres.forEach((g) => genreSet.add(g));

        const isCompleted = lowerLabels.includes("tamat") || lowerLabels.includes("completed");
        const isPopular = lowerLabels.includes("populer") || lowerLabels.includes("popular") || idx < 4;
        const isSeries = lowerLabels.includes("series") || lowerLabels.includes("novel");
        const isChapter = lowerLabels.includes("chapter") || lowerLabels.includes("bab");

        const feedAuthor = entry.author && entry.author[0] && entry.author[0].name ? entry.author[0].name.$t : "";
        const parsedMeta = parseAuthorAndSynopsis(plainText, feedAuthor);
        const slug = slugify(title);

        const novelItem = {
          slug,
          title,
          cover,
          genres: genres.length ? genres : ["Drama"],
          status: isCompleted ? "Tamat" : "Berlanjut",
          authorLine: parsedMeta.authorLine,
          synopsis: parsedMeta.synopsis,
          popular: isPopular
        };

        if (isSeries) {
          seriesMap.set(slug, novelItem);
        } else if (isChapter) {
          const babMatch = title.match(/bab\s*(\d+)/i);
          const chNum = babMatch ? parseInt(babMatch[1], 10) : chapters.length + 1;
          const parentTitle = title.replace(/[-–—:]?\s*bab\s*\d+.*/i, "").trim() || title;
          chapters.push({
            slug: slugify(title),
            seriesSlug: slugify(parentTitle),
            chapterNumber: chNum,
            title,
            bodyText: plainText
          });
        } else {
          fallbackSeries.push(novelItem);
        }
      });

      const mergedSeries = seriesMap.size > 0 ? Array.from(seriesMap.values()) : fallbackSeries;
      if (seriesMap.size > 0 && fallbackSeries.length > 0) {
        fallbackSeries.forEach((item) => {
          if (!seriesMap.has(item.slug)) mergedSeries.push(item);
        });
      }

      chapters.sort((a, b) => a.chapterNumber - b.chapterNumber);

      APP_STATE.seriesList = mergedSeries;
      APP_STATE.chapterList = chapters;
      APP_STATE.musicTracks = tracks;
      APP_STATE.genres = Array.from(genreSet);
    }

    function fetchBloggerFeed() {
      return new Promise((resolve) => {
        const base = (SITE_CONFIG.bloggerUrl || "").replace(/\/+$/, "");
        if (!base) return resolve();

        const cbName = "kbFeedCb_" + Date.now();
        const timer = setTimeout(() => {
          cleanup();
          resolve();
        }, 4500);

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          const el = document.getElementById(cbName);
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        window[cbName] = (data) => {
          cleanup();
          try {
            const entries = (data && data.feed && data.feed.entry) || [];
            parseBloggerFeed(entries);
          } catch (err) {
            console.warn("Feed parse error:", err);
          }
          resolve();
        };

        const script = document.createElement("script");
        script.id = cbName;
        script.src = `${base}/feeds/posts/default?alt=json-in-script&max-results=150&callback=${cbName}`;
        script.onerror = () => {
          cleanup();
          resolve();
        };
        document.body.appendChild(script);
      });
    }

    function ensureAudioPlayer() {
      if (!audioPlayer) {
        audioPlayer = document.createElement("audio");
        audioPlayer.preload = "metadata";
        audioPlayer.addEventListener("ended", () => {
          nextAudioTrack(true);
        });
        document.body.appendChild(audioPlayer);
      }
      return audioPlayer;
    }

    function toggleAudioPlay() {
      const tracks = APP_STATE.musicTracks || [];
      if (!tracks.length) {
        showToast("Belum ada postingan musik (label 'Musik') di Blogger.");
        return;
      }
      const player = ensureAudioPlayer();
      const track = tracks[currentTrackIdx] || tracks[0];
      if (player.src !== track.url) player.src = track.url;

      if (isAudioPlaying) {
        player.pause();
        isAudioPlaying = false;
        renderView();
      } else {
        player.play().then(() => {
          isAudioPlaying = true;
          renderView();
        }).catch(() => {
          isAudioPlaying = false;
          showToast("Audio gagal diputar. Pastikan link file audio valid.");
          renderView();
        });
      }
    }

    function nextAudioTrack(autoPlay = false) {
      const tracks = APP_STATE.musicTracks || [];
      if (!tracks.length) return;
      currentTrackIdx = (currentTrackIdx + 1) % tracks.length;
      const player = ensureAudioPlayer();
      player.src = tracks[currentTrackIdx].url;
      if (autoPlay || isAudioPlaying) {
        player.play().then(() => {
          isAudioPlaying = true;
          renderView();
        }).catch(() => {
          isAudioPlaying = false;
          renderView();
        });
      } else {
        renderView();
      }
    }

    function closePopup() {
      const backdrop = document.getElementById("popupModalBackdrop");
      if (backdrop) backdrop.classList.remove("is-open");
      activePopupType = null;
    }

    function showPopup(type) {
      if (activePopupType) return;
      const cfg = MONETIZATION_CONFIG.popups[type];
      if (!cfg || cfg.enabled === false) return;
      if (type === "welcome" && !userPrefs.popupEnabled) return;
      if (type === "promotional" && (!userPrefs.popupEnabled || !userPrefs.promoEnabled)) return;

      const backdrop = document.getElementById("popupModalBackdrop");
      const body = document.getElementById("popupModalBody");
      if (!backdrop || !body) return;

      activePopupType = type;
      body.innerHTML = `
        <span class="inline-block px-3 py-0.5 rounded-full text-xs font-bold bg-[var(--pastel-soft)] text-[var(--pastel-accent)] mb-2">${escapeHtml(cfg.badge)}</span>
        <h2 class="text-lg font-extrabold text-[var(--pastel-text)] mb-1.5">${escapeHtml(cfg.title)}</h2>
        <p class="text-sm text-[var(--pastel-muted)] mb-5">${escapeHtml(cfg.description)}</p>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closePopup()" class="px-4 py-2 rounded-xl bg-[var(--pastel-soft)] text-xs font-bold cursor-pointer">Tutup</button>
          <button type="button" onclick="closePopup(); openCatalogPage();" class="px-4 py-2 rounded-xl bg-[var(--pastel-accent)] text-white text-xs font-bold cursor-pointer">${escapeHtml(cfg.ctaText || "Buka")}</button>
        </div>
      `;
      backdrop.classList.add("is-open");
    }

    function closePrefModal() {
      const backdrop = document.getElementById("prefModalBackdrop");
      if (backdrop) backdrop.classList.remove("is-open");
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const yr = document.getElementById("footerYear");
      if (yr) yr.textContent = String(new Date().getFullYear());

      loadPrefs();
      applyTheme();
      applySidebar();
      loadBookmarks();
      renderGenrePills();
      renderSidebarAds();

      const popupClose = document.getElementById("popupModalCloseBtn");
      if (popupClose) popupClose.addEventListener("click", closePopup);

      const prefClose = document.getElementById("prefModalCloseBtn");
      if (prefClose) prefClose.addEventListener("click", closePrefModal);

      const savePrefBtn = document.getElementById("savePrefBtn");
      if (savePrefBtn) {
        savePrefBtn.addEventListener("click", () => {
          const c1 = document.getElementById("prefPopupCheck");
          const c2 = document.getElementById("prefPromoCheck");
          const c3 = document.getElementById("prefSidebarCheck");
          if (c1) userPrefs.popupEnabled = c1.checked;
          if (c2) userPrefs.promoEnabled = c2.checked;
          if (c3) userPrefs.sidebarEnabled = c3.checked;
          savePrefs();
          applySidebar();
          closePrefModal();
        });
      }

      APP_STATE.view = "home";
      renderView();

      await fetchBloggerFeed();
      renderGenrePills();
      renderView();
      startHeroCarousel();

      const wCfg = MONETIZATION_CONFIG.popups.welcome;
      if (wCfg && wCfg.enabled) {
        setTimeout(() => showPopup("welcome"), wCfg.delayMs || 3500);
      }
      const pCfg = MONETIZATION_CONFIG.popups.promotional;
      if (pCfg && pCfg.enabled) {
        setTimeout(() => showPopup("promotional"), pCfg.delayMs || 14000);
      }
    });
  </script>
</body>
</html>
